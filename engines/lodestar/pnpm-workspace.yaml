packages:
  - "."
  - "lodestar"
  - "lodestar/packages/*"

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - "@chainsafe/*"

nodeLinker: isolated

catalog:
  vitest: "^4.0.7"
  "@vitest/browser": "^4.0.7"
  "@vitest/browser-playwright": "^4.0.7"
  "@vitest/coverage-v8": "^4.0.7"

overrides:
  dns-over-http-resolver: "^2.1.1"
  loupe: "^2.3.6"
  nan: "^2.19.0"
  elliptic: ">=6.6.1"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  aws-sdk: true
  "@vekexasia/bigint-buffer2": true
  classic-level: true
  core-js: true
  cpu-features: true
  electron: true
  esbuild: true
  nx: true
  ssh2: true
